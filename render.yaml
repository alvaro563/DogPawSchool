# Render Blueprint.
#
# ── Important ──────────────────────────────────────────────────────
# Only the FRONTEND (static site) is declared here. The API web
# service (https://dogpawschool.onrender.com) already exists and is
# dashboard-managed; declaring it as well would create a SECOND API
# service on Blueprint sync. If you later want full IaC, import the
# existing service under the same name first.
#
# ── Why the /api rewrite ──────────────────────────────────────────
# The browser must talk to ONE origin so session cookies
# (access_token / refresh_token, SameSite=Lax, HttpOnly) are
# first-party. Before this rewrite the SPA called the backend
# cross-site: cookies were third-party, browsers blocked or refused
# to send them, and every authenticated request got an instant 401.
# With the rewrite, /api/* is proxied server-side to the backend and
# Set-Cookie comes back attributed to the SPA host.
#
# Equivalent manual setup: Render Dashboard → Static Site →
# Settings → Redirects/Rewrites (rules below), no code required.
services:
  - type: web
    runtime: static
    name: dogpaw-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      # API proxy — MUST come before the SPA catch-all.
      # Destination wildcard = the part captured by /api/*.
      - type: rewrite
        source: /api/*
        destination: https://dogpawschool.onrender.com/api/*
      # SPA fallback for client-side routing (deep links, refresh).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The built index.html has no inline scripts (vite-plugin-pwa
      # loads /registerSW.js as an external file), so script-src
      # 'self' holds. connect-src 'self' is enough because of the
      # /api proxy.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
