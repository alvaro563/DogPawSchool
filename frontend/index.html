<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=N cache-busting: browsers cache favicons by URL, so a
         content-only icon swap would keep showing the old one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1" />
    <!-- iOS "Add to Home Screen": without this link Safari falls back
         to the (unsupported) SVG favicon or a letter placeholder. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy is delivered via HTTP response
      headers only — by the Vite dev server in development, by
      the Go SecurityHeadersMiddleware on every /api/* response,
      and by the production reverse proxy on the SPA itself.
      We do NOT use a meta CSP here because meta CSP cannot be
      made dynamic per-deploy (it would need to allow whatever
      origin the SPA lives at, which differs in dev vs prod),
      and having both a meta CSP and an HTTP header CSP that
      differ would let an attacker bypass one by reading the
      other. Single source of truth: HTTP header.
    -->
    <title>Dog Paw by Ana Such</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
