    get:
      description: |-
        Returns a paginated list of every reservation in the
        system, most recent first. Admin only.
      parameters:
      - description: Maximum number of reservations to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of reservations to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      - description: Filter by status (CONFIRMED, PENDING_TO_CONFIRM, COMPLETED, CANCELLED_IN_TIME,
          CANCELLED_LATE, FORGIVEN, NO_SHOW). Empty = no filter.
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listReservationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List all reservations
      tags:
      - reservations
    post:
      consumes:
      - application/json
      description: |-
        Books any dog with any usable school pass. Admin authority
        bypasses ownership and compatibility conflicts and confirms
        the reservation immediately.
      parameters:
      - description: Reservation to create
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/handler.registerReservationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.registerReservationResponse'
        "400":
