info:
  contact: {}
  description: API for managing dog care activities, reservations, passes and users.
    Protected endpoints require a Bearer JWT obtained from the login endpoint.
  title: DogPaw API
  version: 0.1.0
paths:
  /api/v1/activities:
    get:
      description: Returns a paginated list of activities in the system. Optionally
        filter by date range (from/to, RFC3339, inclusive on both ends) and by closed
        state (?closed=true|false). Most recent first. Limit defaults to 50 and is
        capped at 100. Offset defaults to 0.
      parameters:
      - description: Maximum number of activities to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of activities to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      - description: Filter activities from this date (RFC3339, inclusive)
        in: query
        name: from
        type: string
      - description: Filter activities up to this date (RFC3339, inclusive)
        in: query
        name: to
        type: string
      - description: true = only closed activities, false = only open activities.
          Omit for both.
        in: query
        name: closed
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of activities
          schema:
            $ref: '#/definitions/handler.listActivitiesResponse'
        "400":
          description: Invalid date range or closed value
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List activities (with filters)
      tags:
      - activities
    post:
      consumes:
      - application/json
      description: Creates a new school activity (class, route, individual session,
        or extra). Returns the new resource URL in the Location header.
      parameters:
      - description: Activity to create
        in: body
        name: activity
        required: true
        schema:
          $ref: '#/definitions/handler.registerActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Activity created
          schema:
            $ref: '#/definitions/handler.registerActivityResponse'
        "400":
          description: Invalid request body or missing fields
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Register a new activity
      tags:
