  /api/v1/users/{user_id}:
    get:
      description: Returns the public profile of a user. The password hash is never
        included in the response.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userDTO'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
