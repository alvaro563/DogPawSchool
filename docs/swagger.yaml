  /api/v1/activities/{id}/close:
    post:
      consumes:
      - application/json
      description: |-
        Closes an activity after it has finished. Batch-
        processes every CONFIRMED reservation: those whose
        id appears in no_show_reservation_ids are marked as
        NO_SHOW, the rest are marked as COMPLETED. Then
        the activity is marked as closed and persisted.
        The entire flow runs in a single transaction.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional no-show reservation IDs
        in: body
        name: activity
        schema:
          $ref: '#/definitions/handler.closeActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Activity closed
          schema:
            $ref: '#/definitions/handler.closeActivityResponse'
        "400":
          description: Invalid id, activity not finished, or invalid reservation IDs
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Activity not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Activity already closed or reservation not confirmed
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Close an activity
      tags:
      - activities
  /api/v1/activities/{id}/complete-all:
    post:
      description: |-
        Bulk-completes every CONFIRMED reservation of the
        activity AND closes the activity in a single
        transaction. The activity must have finished
        (date + duration < now). Rejects with 409 if any
        PENDING_TO_CONFIRM reservation is present (admin
        must confirm/reject individually first). Idempotent
        on already-closed activities (returns Closed=true,
        Completed=0).
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
