info:
  contact: {}
  description: API for managing dog care activities, reservations, passes and users.
    Protected endpoints require a Bearer JWT obtained from the login endpoint.
  title: DogPaw API
  version: 0.1.0
paths:
  /api/v1/activities:
    get:
      description: Returns a paginated list of all activities in the system, most
        recent first. Optionally filter by date range with from and to query params
        (RFC3339). Limit defaults to 50 and is capped at 100. Offset defaults to 0.
      parameters:
      - description: Maximum number of activities to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of activities to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      - description: Filter activities from this date (RFC3339)
        in: query
        name: from
        type: string
      - description: Filter activities before this date (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of activities
          schema:
            $ref: '#/definitions/handler.listActivitiesResponse'
        "400":
          description: Invalid date range
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List all activities
      tags:
      - activities
    post:
      consumes:
      - application/json
      description: Creates a new school activity (class, route, individual session,
        or extra). Returns the new resource URL in the Location header.
      parameters:
      - description: Activity to create
        in: body
        name: activity
        required: true
        schema:
          $ref: '#/definitions/handler.registerActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Activity created
          schema:
            $ref: '#/definitions/handler.registerActivityResponse'
        "400":
          description: Invalid request body or missing fields
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Register a new activity
      tags:
      - activities
  /api/v1/activities/{id}:
    get:
      description: Returns a single activity by its id.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Activity found
          schema:
            $ref: '#/definitions/handler.activityResponse'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Activity not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get activity by ID
      tags:
      - activities
    patch:
      consumes:
      - application/json
      description: Partially updates an activity. Only the supplied fields are mutated;
        an empty body is a no-op.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to patch
        in: body
        name: activity
        required: true
        schema:
          $ref: '#/definitions/handler.modifyActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated activity
          schema:
            $ref: '#/definitions/handler.activityResponse'
        "400":
          description: Invalid id, body, or validation error
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Activity not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Patch an activity
      tags:
      - activities
  /api/v1/activities/{id}/close:
    post:
      consumes:
      - application/json
      description: |-
        Closes an activity after it has finished. Batch-
        processes every CONFIRMED reservation: those whose
        id appears in no_show_reservation_ids are marked as
        NO_SHOW, the rest are marked as COMPLETED. Then
        the activity is marked as closed and persisted.
        The entire flow runs in a single transaction.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional no-show reservation IDs
        in: body
        name: activity
        schema:
          $ref: '#/definitions/handler.closeActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Activity closed
          schema:
            $ref: '#/definitions/handler.closeActivityResponse'
        "400":
          description: Invalid id, activity not finished, or invalid reservation IDs
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Activity not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Activity already closed or reservation not confirmed
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Close an activity
      tags:
      - activities
  /api/v1/activities/{id}/reservations:
    get:
      description: |-
        Returns the views of every reservation for the
        given activity, ordered by created_at ASC. Class
        roster view.
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Maximum number of reservations to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of reservations to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listReservationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List an activity's reservations
      tags:
      - reservations
  /api/v1/activities/upcoming:
    get:
      description: Returns a paginated list of activities scheduled at or after the
        current time, soonest first.
      parameters:
      - description: Maximum number of activities to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of activities to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of upcoming activities
          schema:
            $ref: '#/definitions/handler.listActivitiesResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List upcoming activities
      tags:
      - activities
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password. On success it returns
        a signed JWT (HS256) and the user profile. The token expires after 24 hours
        and carries the user ID (sub) and role (role) claims.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: Invalid request body (malformed JSON, missing email, missing
            password)
          schema:
            $ref: '#/definitions/handler.errorResponse'
