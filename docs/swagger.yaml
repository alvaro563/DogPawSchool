  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password. On success it sets
        two HttpOnly cookies (access_token SameSite=Lax, refresh_token SameSite=Strict)
        and returns the user profile with the access TTL. After too many failed attempts
        the account is temporarily locked — a 429 with Retry-After is returned. The
        SPA never sees the raw JWT.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: Invalid request body (malformed JSON, missing email, missing
            password)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Invalid credentials or inactive user
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "429":
          description: Account temporarily locked — too many failed attempts. Retry-After
            header indicates seconds until unlock.
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Authenticate user with email and password
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Clears the access_token and refresh_token cookies. Idempotent —
        calling it twice returns 204 both times. Does NOT invalidate server-side state
        (the tokens remain technically valid until they expire); the cookie clearance
        forces the browser to stop sending them.
      produces:
      - application/json
      responses:
        "204":
          description: Logged out (cookies cleared)
      summary: Clear session cookies
      tags:
      - auth
  /api/v1/auth/password:
    patch:
      consumes:
      - application/json
      description: Verifies the current password and replaces it with a new one. Requires
        a valid access_token cookie. The new password must be at least 8 characters
        and different from the current one. On success the user's token_version is
        bumped — all existing tokens (including the current one) are invalidated.
        Fresh cookies are issued so the SPA stays authenticated.
      parameters:
      - description: Old and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/handler.changePasswordResponse'
        "400":
          description: Invalid request body or validation error (e.g. short new password)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Missing or invalid token, wrong old password, or inactive user
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: New password matches the old one
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Change the authenticated user's password
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Exchanges a valid refresh_token cookie for a new pair of access_token
        + refresh_token cookies. Use this when the access_token has expired but the
        refresh_token is still valid (within 24 hours). Returns 401 if the refresh
        token is missing, malformed, expired, or revoked (e.g. the user changed their
        password). Rate limited by IP.
      produces:
      - application/json
      responses:
        "200":
          description: Cookies refreshed
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "401":
          description: Refresh token missing, invalid, or expired
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "429":
          description: Too many refresh attempts. Retry-After header indicates seconds.
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Refresh the session cookies
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Completes user registration using a valid invitation token. The
        token must be in PENDING status and not expired (48h lifetime). The password
        must be at least 8 characters. On success the response sets two HttpOnly cookies
        (access_token, refresh_token). The SPA never sees the raw JWT. IP rate limited
        by middleware (separate bucket from login).
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.registerWithInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered
          schema:
            $ref: '#/definitions/handler.registerWithInvitationResponse'
        "400":
          description: Invalid request body, missing fields, or validation error (e.g.
            short password)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Token not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Token already used, expired, or revoked
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "429":
          description: Too many registration attempts from this source. Retry-After
            header indicates seconds.
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Register a new user with an invitation token
      tags:
      - auth
