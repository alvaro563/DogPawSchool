    post:
      description: |-
        Admin-only. Cancels any CONFIRMED reservation
        regardless of the owner. The owner user_id is not
        required in the path because the admin does not need
        to know who owns the reservation to cancel it.
        In-time vs late window policy and refund rules are
        identical to the user-cancel endpoint above.
      parameters:
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation cancelled
          schema:
            $ref: '#/definitions/handler.cancelReservationResponse'
        "400":
          description: Invalid reservation_id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Reservation not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Already cancelled / activity in past
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Admin-cancel a reservation
      tags:
      - reservations
  /api/v1/reservations/{id}/forgive:
    post:
      description: |-
        Admin-only. Transitions a CANCELLED_LATE reservation
        to FORGIVEN and, when the pass has available balance,
        refunds the consumed session. The only path that
        converts a late cancellation into a pass refund.
      parameters:
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation forgiven
          schema:
            $ref: '#/definitions/handler.forgiveReservationResponse'
        "400":
          description: Invalid reservation_id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Reservation not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Reservation is not in a state that can be forgiven
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Forgive a late-cancelled reservation
      tags:
      - reservations
  /api/v1/reservations/attendance:
    get:
      description: Returns all COMPLETED reservations whose activity date is in the
        optional [from, to] range. Both bounds are RFC3339 timestamps; "to" is inclusive.
        Date filtering targets the *activity* date (not the booking date). Pagination
        defaults to 100 rows, capped at 1000 for this endpoint. Status is fixed to
        COMPLETED.
      parameters:
      - description: Activity date lower bound, RFC3339. Inclusive.
        in: query
        name: from
        type: string
      - description: Activity date upper bound, RFC3339. Inclusive.
        in: query
        name: to
        type: string
      - description: Max rows (default 100, max 1000)
        in: query
        name: limit
        type: integer
      - description: Rows to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.attendanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Attendance report (JSON)
      tags:
      - attendance
  /api/v1/reservations/attendance.csv:
    get:
      description: Same query as the JSON endpoint, but returns a CSV file (UTF-8
        with BOM, RFC 4180) and uses a higher row cap (50_000) so a year-long report
        is never truncated. The first row is the Spanish header. Status is fixed to
        COMPLETED.
      parameters:
      - description: Activity date lower bound, RFC3339. Inclusive.
        in: query
        name: from
        type: string
      - description: Activity date upper bound, RFC3339. Inclusive.
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: text/csv
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Attendance report (CSV download)
      tags:
      - attendance
  /api/v1/reservations/pending:
    get:
      description: |-
        Returns every reservation in StatusPendingToConfirm,
        each annotated with the dog owner's id and name.
        Server-side partitioning and batched owner lookup
        keep the response shape stable: the admin can
        render the triage page with a single fetch and
        zero filtering. Admin only.
      parameters:
      - description: Maximum number of pending reservations to return (default 50,
          max 100)
        in: query
        name: limit
        type: integer
      - description: Number of pending reservations to skip for pagination (default
          0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Pending reservations
          schema:
            $ref: '#/definitions/handler.pendingReservationsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List pending reservations awaiting admin approval
      tags:
      - reservations
  /api/v1/reservations/upcoming:
    get:
      description: |-
        Returns a paginated list of every CONFIRMED reservation
        whose activity date is at or after now, soonest first.
        Admin only.
      parameters:
      - description: Maximum number of reservations to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of reservations to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listReservationsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List all upcoming reservations
      tags:
      - reservations
  /api/v1/users:
    get:
      description: Returns a paginated list of every user in the system. Intended
        for the admin panel. Limit defaults to 50 and is capped at 100. Offset defaults
        to 0.
      parameters:
      - description: Maximum number of users to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of users to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listUsersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List all users (admin view)
      tags:
      - users
  /api/v1/users/{user_id}:
    get:
      description: Returns the public profile of a user. The password hash is never
        included in the response.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userDTO'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get a user by ID
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Applies a partial update to an existing user. Only the fields present
        in the request body are modified; omitted fields are preserved. An empty body
        is a no-op and returns 200 without touching the database. The password is
        never writable through this endpoint.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Fields to patch (only the fields you want to change)
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handler.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User patched (or no-op if body was empty)
          schema:
            $ref: '#/definitions/handler.updateUserResponse'
        "400":
          description: Invalid id, invalid request body, or validation error (e.g.
            empty name, malformed email)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Patch a user (name and/or email)
      tags:
      - users
  /api/v1/users/{user_id}/activate:
    post:
      description: 'Flips the user''s is_active flag back to true. Idempotent: activating
        an already-active user is a no-op and returns 200.'
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User activated (or already active)
          schema:
            $ref: '#/definitions/handler.activateUserResponse'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Activate a previously deactivated user
      tags:
      - users
  /api/v1/users/{user_id}/deactivate:
    post:
      description: 'Flips the user''s is_active flag to false. Idempotent: deactivating
        an already-inactive user is a no-op and returns 200. The user''s data is preserved.
        Use this for off-boarding instead of hard delete.'
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User deactivated (or already inactive)
          schema:
            $ref: '#/definitions/handler.deactivateUserResponse'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Deactivate a user (soft delete)
      tags:
      - users
  /api/v1/users/{user_id}/passes:
    get:
      description: Returns a paginated list of passes owned by the user identified
        by the user_id path param.
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Maximum number of passes to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of passes to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of passes
          schema:
            $ref: '#/definitions/handler.listPassesResponse'
        "400":
          description: Invalid user_id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List passes owned by a user
      tags:
      - passes
    post:
      consumes:
      - application/json
      description: Creates a new prepaid session pack for the user identified by the
        user_id path param. Price is stored in cents.
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Pass to create
        in: body
        name: pass
        required: true
        schema:
          $ref: '#/definitions/handler.registerPassRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Pass created
          schema:
            $ref: '#/definitions/handler.registerPassResponse'
        "400":
          description: Invalid user_id, request body, or missing fields
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Register a new pass (bono) for a user
      tags:
      - passes
  /api/v1/users/{user_id}/reservations:
    get:
      description: |-
        Returns the denormalized ReservationView for every
        reservation whose dog is owned by the user in the
        path, ordered by created_at DESC. Supports
        optional filters: status, from, to.
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Filter by status (CONFIRMED, COMPLETED, CANCELLED_IN_TIME, CANCELLED_LATE,
          FORGIVEN, NO_SHOW)
        in: query
        name: status
        type: string
      - description: Filter by created_at >= from (RFC3339)
        in: query
        name: from
        type: string
      - description: Filter by created_at <  to (RFC3339)
        in: query
        name: to
        type: string
      - description: Maximum number of reservations to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of reservations to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listReservationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List a user's reservations
      tags:
      - reservations
    post:
      consumes:
      - application/json
      description: |-
        Books a dog into an activity, paid from one of the
        owner's passes. Atomically: validates the activity
        is in the future and not full, the dog is owned by
        the user in the path, and the pass is owned by the
        user and has at least one session. Consumes one pass
        session and creates the reservation in StatusConfirmed.
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Reservation to create
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/handler.registerReservationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Reservation created
          schema:
            $ref: '#/definitions/handler.registerReservationResponse'
        "400":
          description: Invalid user_id, request body, or missing fields
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Activity full or duplicate reservation
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Book a reservation for a dog
      tags:
      - reservations
  /api/v1/users/{user_id}/reservations/{id}:
    get:
      description: |-
        Returns the denormalized ReservationView for the
        given reservation id, owned by the user in the
        path. Returns 404 if the id does not exist OR if
        the reservation belongs to a different user (no
        leak).
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.reservationViewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get a reservation by id
      tags:
      - reservations
  /api/v1/users/{user_id}/reservations/{id}/cancel:
    post:
      description: |-
        Cancels a CONFIRMED reservation owned by the user in
        the path. The activity must still be in the future
        and the reservation must be in StatusConfirmed. If
        the cancel happens more than 2h before the activity
        date, the reservation transitions to
        StatusCancelledInTime AND the pass session is
        refunded (remaining_sessions + 1, audit movement +1
        appended). If the cancel happens within the late
        window, the reservation transitions to
        StatusCancelledLate and no refund is applied (an
        admin can later call Forgive to refund it).
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation cancelled
          schema:
            $ref: '#/definitions/handler.cancelReservationResponse'
        "400":
          description: Invalid user_id or reservation_id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Reservation not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Already cancelled / not in a cancellable state
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Cancel a reservation
      tags:
      - reservations
  /api/v1/users/{user_id}/reservations/{id}/complete:
    post:
      description: |-
        Transitions a CONFIRMED reservation to COMPLETED.
        The activity must have already finished
        (date + duration < now). Does not refund the pass
        session because the session was consumed at
        registration and the activity has been delivered.
        Owner-only: the user_id in the path must own the
        dog. Returns 404 if the reservation does not exist
        OR belongs to a different user (no leak).
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation marked completed
          schema:
            $ref: '#/definitions/handler.completeReservationResponse'
        "400":
          description: Invalid user_id / reservation_id, or activity has not finished
            yet
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Reservation or activity not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Reservation not in CONFIRMED state (not_completable)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Mark a reservation as completed
      tags:
      - reservations
  /api/v1/users/{user_id}/reservations/{id}/confirm:
    post:
      description: |-
        Admin-only. Promotes a PENDING_TO_CONFIRM reservation
        (created with only MEDIA/BAJA compatibility conflicts)
        to CONFIRMED. The slot is already held, so no capacity
        re-check is performed.
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation confirmed
          schema:
            $ref: '#/definitions/handler.confirmPendingReservationResponse'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Reservation not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Reservation is not pending (not_pending)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Confirm a pending reservation
      tags:
      - reservations
  /api/v1/users/{user_id}/reservations/{id}/no-show:
    post:
      description: |-
        Transitions a CONFIRMED reservation to NO_SHOW.
        The activity must have already started
        (date < now). Does not refund the pass session
        because the slot is past. Owner-only: the
        user_id in the path must own the dog. Returns 404
        if the reservation does not exist OR belongs to
        a different user (no leak).
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation marked no-show
          schema:
            $ref: '#/definitions/handler.markNoShowResponse'
        "400":
          description: Invalid user_id / reservation_id, or activity has not started
            yet
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Reservation or activity not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Reservation not in CONFIRMED state (not_cancellable)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Mark a reservation as no-show
      tags:
      - reservations
  /api/v1/users/{user_id}/reservations/{id}/reject:
    post:
      description: |-
        Admin-only. Demotes a PENDING_TO_CONFIRM reservation to
        CANCELLED_IN_TIME (freeing the slot) and refunds the
        pass session consumed at booking.
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservation rejected
          schema:
            $ref: '#/definitions/handler.confirmPendingReservationResponse'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Reservation not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Reservation is not pending (not_pending)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Reject a pending reservation
      tags:
      - reservations
  /api/v1/users/{user_id}/reservations/upcoming:
    get:
      description: |-
        Returns the views of every CONFIRMED reservation
        whose activity date is at or after the current
        time, ordered by activity date ASC.
      parameters:
      - description: Owner user ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Maximum number of reservations to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Number of reservations to skip for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listReservationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List a user's upcoming reservations
      tags:
      - reservations
  /api/v1/users/emails:
    get:
      description: Returns the email of every registered user, ordered by user id.
        Intended for the admin panel (e.g. bulk communications). Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listUserEmailsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List all user emails (admin view)
      tags:
      - users
  /api/v1/users/me:
    get:
      description: Returns the public profile of the user identified by the access_token
        cookie. Used by the SPA on first page load to decide whether to render the
        authenticated shell or kick the user back to /auth/login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userDTO'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: User no longer exists
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get the authenticated user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Paste the token returned by /api/v1/auth/login as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
